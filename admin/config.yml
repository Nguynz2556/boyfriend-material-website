# =============================================================================
# CẤU HÌNH DECAP CMS — Boyfriend Material
# =============================================================================
# File này định nghĩa những gì bạn sửa được trong trang /admin (không cần code).
# XEM HUONG-DAN.md mục 17 để biết cách kết nối phần "backend" bên dưới với
# GitHub/Netlify — bắt buộc phải làm bước đó thì trang /admin mới đăng nhập
# và lưu bài được, config này KHÔNG tự hoạt động nếu chưa nối backend.
# =============================================================================

backend:
  name: git-gateway   # Dùng Netlify Identity + Git Gateway (xem HUONG-DAN.md mục 17, Cách A)
  branch: main         # Đổi thành "master" nếu nhánh chính của bạn tên là master

# Nơi lưu ảnh khi bạn tải lên trong trang admin
media_folder: "images/uploads"
public_folder: "images/uploads"

# Bật xem trước bên phải màn hình khi soạn nội dung
publish_mode: simple

collections:

  # ---------------------------------------------------------------------
  # 1. NGƯỜI ĐỒNG HÀNH — sửa thông tin + ảnh từng người, không cần code
  # ---------------------------------------------------------------------
  - name: "companions"
    label: "Người đồng hành"
    label_singular: "Người đồng hành"
    folder: "content/companions"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "name"
    # Mỗi người có 1 thư mục ảnh RIÊNG (theo slug) — tránh 2 người vô tình tải ảnh trùng tên
    # gốc (ví dụ cả 2 đều tên IMG_0001.jpg từ điện thoại) rồi ghi đè ảnh của nhau.
    media_folder: "/images/uploads/{{slug}}"
    public_folder: "/images/uploads/{{slug}}"
    fields:
      - { label: "ID (số thứ tự, không trùng)", name: "id", widget: "number" }
      - { label: "Đường dẫn (slug, viết liền không dấu, ví dụ hoang-nguyen)", name: "slug", widget: "string" }
      - { label: "Tên", name: "name", widget: "string" }
      - { label: "Tuổi", name: "age", widget: "number" }
      - label: "Khu vực"
        name: "loc"
        widget: "select"
        options: ["TP. Hồ Chí Minh", "Hà Nội", "Đà Nẵng"]
      - { label: "Giá / giờ (VNĐ) — không dùng để hiện giá, chỉ để tham khảo nội bộ", name: "price", widget: "number", required: false }
      - { label: "Đánh giá (1-5)", name: "rating", widget: "number", value_type: "float", min: 1, max: 5 }
      - { label: "Số lượt đánh giá", name: "reviews", widget: "number" }
      - { label: "Số lượt đặt", name: "bookings", widget: "number" }
      - { label: "Chiều cao", name: "height", widget: "string" }
      - { label: "Cân nặng", name: "weight", widget: "string" }
      - { label: "Nghề nghiệp", name: "job", widget: "string" }
      - label: "Hoạt động chính"
        name: "activity"
        widget: "select"
        options: ["Đi ăn / Cafe", "Du lịch", "Sự kiện", "Xem phim", "Mua sắm", "Chơi game"]
      - label: "Dịch vụ người này cung cấp (bỏ trống = cung cấp TẤT CẢ dịch vụ)"
        name: "services_offered"
        widget: "select"
        multiple: true
        required: false
        hint: "Danh sách phải khớp đúng chính tả với tên dịch vụ ở mục Trang Dịch vụ. Bỏ trống nếu người này nhận mọi dịch vụ."
        options: ["Đi ăn / Cafe", "Du lịch", "Sự kiện", "Mua sắm", "Xem phim", "Chơi game", "Thể thao / Concert", "Học tập", "Trò chuyện online", "Tâm sự", "Trợ lý cá nhân", "Gym / Tập luyện cùng"]
      - { label: "Giới thiệu", name: "bio", widget: "text" }
      - label: "Sở thích"
        name: "hobbies"
        widget: "list"
      - label: "Tính cách (đúng 4 mục)"
        name: "personality"
        widget: "list"
      - { label: "Ngày sinh", name: "birth", widget: "string" }
      - { label: "Quê quán", name: "hometown", widget: "string" }
      - { label: "Học vấn", name: "edu", widget: "string" }
      - { label: "Ảnh đại diện (avatar)", name: "avatar", widget: "image" }
      - { label: "Ảnh bìa", name: "cover", widget: "image" }
      - label: "Thư viện ảnh (5 ảnh)"
        name: "gallery"
        widget: "list"
        field: { label: "Ảnh", name: "image", widget: "image" }
      - { label: "Đã xác minh eKYC?", name: "ekycVerified", widget: "boolean", default: true }

  # ---------------------------------------------------------------------
  # 2. DANH SÁCH HIỂN THỊ — sau khi thêm người mới ở trên, PHẢI thêm slug
  #    của người đó vào đây thì mới hiện lên site (xem HUONG-DAN.md mục 17)
  # ---------------------------------------------------------------------
  - name: "manifest"
    label: "Danh sách hiển thị trên site"
    files:
      - name: "manifest"
        label: "Danh sách slug đang hiển thị"
        file: "content/manifest.json"
        fields:
          - label: "Slug của từng người (phải khớp đúng ô 'Đường dẫn' ở mục Người đồng hành)"
            name: "slugs"
            widget: "list"

  # ---------------------------------------------------------------------
  # 3. THÔNG TIN CHUNG CỦA SITE — logo, trang chủ, liên hệ, thông tin công ty
  # ---------------------------------------------------------------------
  - name: "settings"
    label: "Thông tin chung"
    files:
      - name: "settings"
        label: "Logo, Trang chủ & Liên hệ"
        file: "content/settings.json"
        fields:
          - { label: "Logo (hiện ở header + footer mọi trang)", name: "site_logo", widget: "image", media_folder: "/images/uploads/site", public_folder: "/images/uploads/site" }
          - label: "Đường dẫn Apps Script (kết nối Google Sheet — xem HUONG-DAN.md mục 25)"
            name: "google_webapp_url"
            widget: "string"
            required: false
            hint: "Dán URL dạng https://script.google.com/macros/s/.../exec sau khi deploy Apps Script. Để trống thì mọi lượt đăng ký/đặt lịch sẽ KHÔNG được gửi về Google Sheet."
          - { label: "Ảnh minh hoạ trang chủ (bên phải khu vực tiêu đề)", name: "hero_image", widget: "image", required: false, media_folder: "/images/uploads/site", public_folder: "/images/uploads/site" }
          - { label: "Tiêu đề trang chủ - dòng 1", name: "hero_title_line1", widget: "string" }
          - { label: "Tiêu đề trang chủ - chữ nhấn (màu vàng)", name: "hero_title_accent", widget: "string" }
          - { label: "Mô tả ngắn trang chủ", name: "hero_desc", widget: "text" }
          - { label: "Tiêu đề khu vực Video giới thiệu (TVC)", name: "tvc_title", widget: "string" }
          - label: "Video TVC — dán link YouTube/Vimeo, HOẶC dán đường dẫn file video đã tải lên mục Media"
            name: "tvc_video_url"
            widget: "string"
            required: false
            hint: "Dán link dạng https://www.youtube.com/watch?v=... hoặc https://vimeo.com/... Nếu muốn tải file video lên trực tiếp, vào tab Media ở trên cùng để tải lên trước, sau đó copy đường dẫn file dán vào đây. Để trống thì khu vực video sẽ tự ẩn trên trang chủ."
          - { label: "Tiêu đề trang Liên hệ", name: "contact_intro_title", widget: "string" }
          - { label: "Mô tả trang Liên hệ", name: "contact_intro_desc", widget: "string" }
          - { label: "Số hotline", name: "contact_hotline", widget: "string" }
          - { label: "Email liên hệ", name: "contact_email", widget: "string" }
          - { label: "Địa chỉ", name: "contact_address", widget: "string" }
          - { label: "Giờ làm việc", name: "contact_hours", widget: "string" }
          - { label: "Link Facebook", name: "facebook_url", widget: "string" }
          - { label: "Link Instagram", name: "instagram_url", widget: "string" }
          - { label: "Link YouTube", name: "youtube_url", widget: "string" }
          - { label: "Tên pháp lý công ty (dùng trong hợp đồng)", name: "company_legal_name", widget: "string" }
          - { label: "Mã số thuế (dùng trong hợp đồng)", name: "company_tax_code", widget: "string", required: false }
          - { label: "Địa chỉ công ty (dùng trong hợp đồng)", name: "company_address", widget: "string" }
          - { label: "SĐT công ty (dùng trong hợp đồng)", name: "company_phone", widget: "string" }
          - { label: "Email công ty (dùng trong hợp đồng)", name: "company_email", widget: "string" }
          - { label: "Người đại diện (dùng trong hợp đồng)", name: "company_representative", widget: "string" }
          - { label: "Chức vụ người đại diện", name: "company_position", widget: "string", required: false }
          - { label: "Số tài khoản ngân hàng (dùng trong hợp đồng)", name: "company_bank_account", widget: "string", required: false }
          - { label: "Tên ngân hàng", name: "company_bank_name", widget: "string", required: false }

  # ---------------------------------------------------------------------
  # 4. TRANG DỊCH VỤ — sửa gói theo giờ / theo ngày
  # ---------------------------------------------------------------------
  - name: "page_dichvu"
    label: "Trang Dịch vụ"
    files:
      - name: "dichvu"
        label: "Nội dung trang Dịch vụ"
        file: "content/pages/dich-vu.json"
        fields:
          - { label: "Tiêu đề", name: "intro_title", widget: "string" }
          - { label: "Mô tả", name: "intro_desc", widget: "string" }
          - label: "Các gói Theo giờ"
            name: "packages_hourly"
            widget: "list"
            fields:
              - { label: "Tên gói", name: "name", widget: "string" }
              - { label: "Giá", name: "price", widget: "string" }
              - { label: "Nổi bật? (hiện khung vàng)", name: "featured", widget: "boolean", default: false }
              - { label: "Tính năng", name: "features", widget: "list" }
          - label: "Các gói Theo ngày"
            name: "packages_daily"
            widget: "list"
            fields:
              - { label: "Tên gói", name: "name", widget: "string" }
              - { label: "Giá", name: "price", widget: "string" }
              - { label: "Nổi bật? (hiện khung vàng)", name: "featured", widget: "boolean", default: false }
              - { label: "Tính năng", name: "features", widget: "list" }

  # ---------------------------------------------------------------------
  # 5. TRANG VỀ CHÚNG TÔI — sửa chữ, ảnh, số liệu thống kê
  # ---------------------------------------------------------------------
  - name: "page_vechungtoi"
    label: "Trang Về chúng tôi"
    files:
      - name: "vechungtoi"
        label: "Nội dung trang Về chúng tôi"
        file: "content/pages/ve-chung-toi.json"
        fields:
          - { label: "Tiêu đề", name: "intro_title", widget: "string" }
          - { label: "Mô tả ngắn", name: "intro_desc", widget: "text" }
          - { label: "Nội dung sứ mệnh", name: "mission_text", widget: "text" }
          - { label: "Ảnh minh hoạ", name: "image", widget: "image", media_folder: "/images/uploads/about", public_folder: "/images/uploads/about" }
          - label: "4 ô số liệu thống kê"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Số liệu (ví dụ 500+, 4.9/5)", name: "number", widget: "string" }
              - { label: "Mô tả", name: "label", widget: "string" }
